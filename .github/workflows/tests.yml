name: Windows tests and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - if: matrix.python == '3.12'
        run: python -m PyInstaller --noconfirm --clean --onefile --name ImageWatcher --hidden-import winotify src/main.py
      - if: matrix.python == '3.12'
        run: ./dist/ImageWatcher.exe --version
