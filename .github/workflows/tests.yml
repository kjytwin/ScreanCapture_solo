name: Windows tests and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - if: matrix.python == '3.12'
        run: python -m PyInstaller --noconfirm --clean --onefile --name ImageWatcher --hidden-import winotify src/main.py
      - if: matrix.python == '3.12'
        run: ./dist/ImageWatcher.exe --version
      - if: matrix.python == '3.12'
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ImageWatcherGUI --hidden-import winotify src/gui.py
      - if: matrix.python == '3.12'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./dist/ImageWatcherGUI.exe -ArgumentList --smoke-test -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ImageWatcher-Windows
          path: |
            dist/ImageWatcher.exe
            dist/ImageWatcherGUI.exe
