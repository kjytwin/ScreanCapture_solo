[watch]
reference = reference.png
monitor = 1
region = full
confidence = 0.85
disappearance_confidence = 0.80
interval_ms = 100
consecutive_matches = 2
consecutive_misses = 3
cooldown_seconds = 3

[notification]
sound = true
desktop_notification = true
save_capture = true

[storage]
log_directory = logs
capture_directory = captures
retention_days = 7
max_capture_mb = 512
max_log_mb = 5
log_backups = 3

